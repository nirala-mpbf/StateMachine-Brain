
brain:
  workflow:
    initial-state: OTP_VERIFICATION
    terminal-state: COMPLETED

    states:
      - OTP_VERIFICATION
      - PROFILE_DETAILS
      - ACCOUNT_STATEMENT_UPLOAD
      - UDYAM_DOCUMENT_UPLOAD
      - COMPLETED

    transitions:
      - source: OTP_VERIFICATION
        event: OTP_VERIFIED
        target: PROFILE_DETAILS

      - source: PROFILE_DETAILS
        event: PROFILE_SUBMITTED
        target: ACCOUNT_STATEMENT_UPLOAD

      - source: ACCOUNT_STATEMENT_UPLOAD
        event: ACCOUNT_STATEMENT_UPLOADED
        target: UDYAM_DOCUMENT_UPLOAD

      - source: UDYAM_DOCUMENT_UPLOAD
        event: UDYAM_DOCUMENT_UPLOADED
        target: COMPLETED
